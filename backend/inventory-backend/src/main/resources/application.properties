spring.application.name=inventory-backend

# --- Database (reads from environment variables, falls back to local values for dev) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:student}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Server ---
server.port=${PORT:8080}

# --- JWT ---
jwt.secret=${JWT_SECRET:ThisIsASecretKeyForInventorySystemMakeItLongAndRandom123456789}
jwt.expiration=${JWT_EXPIRATION:604800000}